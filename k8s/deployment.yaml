apiVersion: v1
kind: Namespace
metadata:
  name: researchhive
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: researchhive-api
  namespace: researchhive
  labels:
    app: researchhive-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: researchhive-api
  template:
    metadata:
      labels:
        app: researchhive-api
    spec:
      containers:
      - name: api
        image: researchhive/api:latest
        ports:
        - containerPort: 4000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: researchhive-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: researchhive-secrets
              key: redis-url
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: researchhive-secrets
              key: anthropic-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: researchhive-web
  namespace: researchhive
  labels:
    app: researchhive-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: researchhive-web
  template:
    metadata:
      labels:
        app: researchhive-web
    spec:
      containers:
      - name: web
        image: researchhive/web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.researchhive.ai"
        - name: LOGTO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: researchhive-secrets
              key: logto-endpoint
        - name: LOGTO_APP_ID
          valueFrom:
            secretKeyRef:
              name: researchhive-secrets
              key: logto-app-id
        - name: LOGTO_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: researchhive-secrets
              key: logto-app-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: researchhive-api-service
  namespace: researchhive
spec:
  selector:
    app: researchhive-api
  ports:
  - protocol: TCP
    port: 4000
    targetPort: 4000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: researchhive-web-service
  namespace: researchhive
spec:
  selector:
    app: researchhive-web
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: researchhive-ingress
  namespace: researchhive
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - researchhive.ai
    - api.researchhive.ai
    secretName: researchhive-tls
  rules:
  - host: researchhive.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: researchhive-web-service
            port:
              number: 3000
  - host: api.researchhive.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: researchhive-api-service
            port:
              number: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: researchhive-api-hpa
  namespace: researchhive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: researchhive-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: researchhive-web-hpa
  namespace: researchhive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: researchhive-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
