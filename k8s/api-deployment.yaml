apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: vibecast-production
  labels:
    app: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: ghcr.io/mrkingsleyobi/vibecast-api:latest
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "4000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vibecast-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: vibecast-config
              key: REDIS_HOST
        - name: RABBITMQ_URL
          valueFrom:
            configMapKeyRef:
              name: vibecast-config
              key: RABBITMQ_HOST
        - name: HUGGINGFACE_API_KEY
          valueFrom:
            secretKeyRef:
              name: vibecast-secrets
              key: huggingface-api-key
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: vibecast-secrets
              key: openrouter-api-key
        envFrom:
        - configMapRef:
            name: vibecast-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: vibecast-production
spec:
  selector:
    app: api
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: vibecast-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
