apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: vibecast-production
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ghcr.io/mrkingsleyobi/vibecast-web:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: production
        - name: NEXT_PUBLIC_API_URL
          value: https://api.vibecast.ai
        - name: NEXT_PUBLIC_WS_URL
          value: wss://api.vibecast.ai
        - name: NEXTAUTH_URL
          value: https://vibecast.ai
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: vibecast-secrets
              key: nextauth-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: vibecast-production
spec:
  selector:
    app: web
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
