apiVersion: v1
kind: ConfigMap
metadata:
  name: vibecast-config
  namespace: vibecast-production
data:
  # Database
  DATABASE_HOST: postgres-service
  DATABASE_PORT: "5432"
  DATABASE_NAME: vibecast

  # Redis
  REDIS_HOST: redis-service
  REDIS_PORT: "6379"

  # RabbitMQ
  RABBITMQ_HOST: rabbitmq-service
  RABBITMQ_PORT: "5672"

  # Qdrant
  QDRANT_URL: http://qdrant-service:6333

  # Neo4j
  NEO4J_URL: bolt://neo4j-service:7687
  NEO4J_USER: neo4j

  # Meilisearch
  MEILISEARCH_URL: http://meilisearch-service:7700

  # Application
  NODE_ENV: production
  LOG_LEVEL: info

  # Features
  AGENTDB_ENABLED: "true"
  CLAUDE_FLOW_ENABLED: "true"
