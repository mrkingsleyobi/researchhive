version: '3.9'

services:
  # ============================================
  # Frontend Applications
  # ============================================

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: vibecast-web
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
      - NEXT_PUBLIC_MCP_URL=http://localhost:4000/api/mcp
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - LOGTO_ENDPOINT=http://logto:3001
      - LOGTO_APP_ID=vibecast-web
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - api
      - logto
    networks:
      - vibecast-network
    restart: unless-stopped

  # ============================================
  # Backend Services
  # ============================================

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: vibecast-api
    ports:
      - '4000:4000'
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://vibecast:vibecast123@postgres:5432/vibecast
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=vibecast123
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_KEY=masterKey
      - LOGTO_ENDPOINT=http://logto:3001
      - LOGTO_APP_ID=vibecast-api
      - LOGTO_APP_SECRET=dev-secret
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AGENTDB_ENABLED=true
      - CLAUDE_FLOW_ENABLED=true
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
      - /app/apps/api/dist
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - qdrant
      - meilisearch
    networks:
      - vibecast-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # CMS (Strapi)
  # ============================================

  strapi:
    image: strapi/strapi:4.15
    container_name: vibecast-strapi
    ports:
      - '1337:1337'
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=vibecast_cms
      - DATABASE_USERNAME=vibecast
      - DATABASE_PASSWORD=vibecast123
      - JWT_SECRET=dev-jwt-secret-change-in-production
      - ADMIN_JWT_SECRET=dev-admin-jwt-secret
      - APP_KEYS=dev-app-key-1,dev-app-key-2
      - API_TOKEN_SALT=dev-api-token-salt
    volumes:
      - ./apps/strapi:/srv/app
      - strapi_uploads:/srv/app/public/uploads
    depends_on:
      - postgres
    networks:
      - vibecast-network
    restart: unless-stopped

  # ============================================
  # Workflow Engine (n8n)
  # ============================================

  n8n:
    image: n8nio/n8n:latest
    container_name: vibecast-n8n
    ports:
      - '5678:5678'
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=vibecast_n8n
      - DB_POSTGRESDB_USER=vibecast
      - DB_POSTGRESDB_PASSWORD=vibecast123
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/New_York
    volumes:
      - n8n_data:/home/node/.n8n
      - ./packages/n8n-nodes:/home/node/.n8n/custom
    depends_on:
      - postgres
      - api
    networks:
      - vibecast-network
    restart: unless-stopped

  # ============================================
  # Databases
  # ============================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: vibecast-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=vibecast
      - POSTGRES_PASSWORD=vibecast123
      - POSTGRES_DB=vibecast
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vibecast-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecast"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vibecast-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass vibecast123
    volumes:
      - redis_data:/data
    networks:
      - vibecast-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vibecast-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - vibecast-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5.15-community
    container_name: vibecast-neo4j
    ports:
      - '7474:7474'  # HTTP
      - '7687:7687'  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/vibecast123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - vibecast-network
    restart: unless-stopped

  # ============================================
  # Message Queue
  # ============================================

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vibecast-rabbitmq
    ports:
      - '5672:5672'   # AMQP
      - '15672:15672' # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=vibecast
      - RABBITMQ_DEFAULT_PASS=vibecast123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - vibecast-network
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Search Engine
  # ============================================

  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: vibecast-meilisearch
    ports:
      - '7700:7700'
    environment:
      - MEILI_MASTER_KEY=masterKey
      - MEILI_ENV=development
      - MEILI_DB_PATH=/meili_data
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - vibecast-network
    restart: unless-stopped

  # ============================================
  # API Gateway
  # ============================================

  kong:
    image: kong:latest
    container_name: vibecast-kong
    ports:
      - '8000:8000'  # Proxy
      - '8001:8001'  # Admin API
      - '8443:8443'  # Proxy SSL
      - '8444:8444'  # Admin API SSL
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=postgres
      - KONG_PG_PORT=5432
      - KONG_PG_DATABASE=vibecast_kong
      - KONG_PG_USER=vibecast
      - KONG_PG_PASSWORD=vibecast123
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
    depends_on:
      - postgres
      - kong-migration
    networks:
      - vibecast-network
    restart: unless-stopped

  kong-migration:
    image: kong:latest
    container_name: vibecast-kong-migration
    command: kong migrations bootstrap
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=postgres
      - KONG_PG_PORT=5432
      - KONG_PG_DATABASE=vibecast_kong
      - KONG_PG_USER=vibecast
      - KONG_PG_PASSWORD=vibecast123
    depends_on:
      - postgres
    networks:
      - vibecast-network
    restart: on-failure

  # ============================================
  # Authentication (Logto)
  # ============================================

  logto:
    image: svhd/logto:latest
    container_name: vibecast-logto
    ports:
      - '3001:3001'
      - '3002:3002'
    environment:
      - DB_URL=postgresql://vibecast:vibecast123@postgres:5432/vibecast_logto
      - ENDPOINT=http://localhost:3001
      - ADMIN_ENDPOINT=http://localhost:3002
      - PORT=3001
      - ADMIN_PORT=3002
    depends_on:
      - postgres
    networks:
      - vibecast-network
    restart: unless-stopped

  # ============================================
  # Monitoring & Observability
  # ============================================

  prometheus:
    image: prom/prometheus:latest
    container_name: vibecast-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - vibecast-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: vibecast-grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - vibecast-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: vibecast-loki
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    networks:
      - vibecast-network
    restart: unless-stopped

# ============================================
# Networks
# ============================================

networks:
  vibecast-network:
    driver: bridge

# ============================================
# Volumes
# ============================================

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  meilisearch_data:
  prometheus_data:
  grafana_data:
  loki_data:
  strapi_uploads:
  n8n_data:
